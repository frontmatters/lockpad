name: Release

# Pushes a tag of shape `v1.2.3` → builds multi-arch image, pushes to Docker
# Hub under the corresponding `:1.2.3` and `:latest` tags, then keyless-signs
# the manifest digest via Sigstore + GitHub OIDC.
#
# Required repo secrets (set via `gh secret set ...`):
#   DOCKERHUB_USER    = frontmatters
#   DOCKERHUB_TOKEN   = PAT with Read+Write+Delete on Docker Hub repos

on:
  push:
    tags:
      - 'v*'

# Cosign keyless needs id-token: write so the runner can mint an OIDC
# token bound to this workflow + tag, which Sigstore Fulcio uses to issue
# the ephemeral signing cert.
permissions:
  contents: write    # write needed for action-gh-release to create the Release
  id-token: write    # cosign keyless OIDC

jobs:
  release:
    name: Build, push, and sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            frontmatters/lockpad:${{ steps.version.outputs.version }}
            frontmatters/lockpad:latest
          labels: |
            org.opencontainers.image.title=Lockpad
            org.opencontainers.image.description=Self-hostable zero-knowledge notepad
            org.opencontainers.image.vendor=Frontmatters
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign manifest (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "frontmatters/lockpad@${DIGEST}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "frontmatters/lockpad@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/release\.yml@refs/tags/v.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Lockpad ${{ steps.version.outputs.version }}

            **Image**: `frontmatters/lockpad:${{ steps.version.outputs.version }}`
            **Digest**: `${{ steps.build.outputs.digest }}`
            **Architectures**: linux/amd64, linux/arm64

            ### Pull and verify

            ```bash
            docker pull frontmatters/lockpad:${{ steps.version.outputs.version }}

            cosign verify \
              frontmatters/lockpad@${{ steps.build.outputs.digest }} \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.+$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```

            See [CHANGELOG.md](./CHANGELOG.md) for what's new.
