# Lockpad — production-oriented compose file.
#
# Compose project name pinned so the named volume is always `lockpad_storage`
# regardless of the directory the user clones into. The backup recipe below
# only works if this is set.
name: lockpad

# Required env (see .env.example):
#   SERVER_SECRET   32+ char random string. Hard-fails if missing.
#   DOMAIN          (optional) for Caddy reverse proxy; defaults to lockpad.local
#
# Bring up:
#   cp .env.example .env  &&  edit .env  &&  docker compose up -d
#
# Notes:
#  - Listens on 127.0.0.1 only. Public ingress is meant to go through a reverse
#    proxy (Caddy/Traefik/nginx) that terminates TLS. UFW does NOT block
#    Docker-published ports, so a 0.0.0.0 binding here would bypass host firewall.
#  - Storage is a named volume to avoid host-uid vs container-uid collisions.
#    Compose prefixes the volume name with the project name (the directory),
#    so on a fresh checkout the volume is e.g. `lockpad_storage`.
#    Backup:  docker run --rm -v lockpad_storage:/data:ro -v $PWD:/out busybox tar czf /out/lockpad-storage-$(date +%F).tgz /data

services:
  lockpad:
    container_name: lockpad
    build:
      context: .
      dockerfile: Dockerfile
    image: lockpad:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      # The `:?...` syntax makes compose fail fast if SERVER_SECRET is empty
      # rather than starting an insecure backend (which would then exit 1 on
      # its own — but compose's message is more actionable).
      SERVER_SECRET: ${SERVER_SECRET:?SERVER_SECRET must be set — see .env.example}
      STORAGE_DIR: /data/storage
      # Pass-through with empty fallback: when MAX_BLOB_SIZE is unset, the
      # container env var is empty and config.ts falls back to its 64 KiB
      # default. Setting MAX_BLOB_SIZE in .env (accepts "1mb", "750kb",
      # "65536", or "DEFAULT") tunes this instance without changing the
      # image-level default. See README Configuration table.
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-}

    volumes:
      - storage:/data/storage

    ports:
      # Bind via LOCKPAD_BIND env (see .env.example). Default 127.0.0.1 = localhost only.
      # For LAN access: LOCKPAD_BIND=0.0.0.0 (HTTP, no TLS — use Caddy for production).
      - "${LOCKPAD_BIND:-127.0.0.1}:3000:3000"

    # Hardening — every line below counter a specific audit Docker finding.
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  storage:
    driver: local
